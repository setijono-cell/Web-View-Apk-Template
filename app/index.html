<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jadwal Sholat</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background-color: #000000;
  color: #FFBF00;
  font-family: "Arial ", "Roboto", sans-serif;
  font-weight: 700;
  overflow: hidden;
}
.wrapper{display:table;width:100%;height:100%}
.top-row{display:table-row;height:80%}
.top-cell{display:table-cell;vertical-align:middle}
.container{display:table;width:100%;height:100%;table-layout:fixed}
.col{display:table-cell;width:50%;vertical-align:middle;text-align:center;padding:6px}
.sub {
  font-size: 3.2vw;   /* Otomatis ~32px di tablet, ~16px di HP kecil */
}
.main {
  font-size: 8.5vw;   /* Otomatis ~85px di tablet, ~40px di HP kecil — tidak pernah terpotong */
}
.alert{color:#D90000}
.bot-row{display:table-row;height:20%}
.bot-cell{display:table-cell;vertical-align:bottom;padding:0 8px 18px 8px}
.grid6{display:table;width:100%;table-layout:fixed;border-collapse:collapse;background:rgba(0,0,0,0.08);border-radius:8px}
.p-box{display:table-cell;text-align:center;padding:8px 2px;border-right:1px solid rgba(0,0,0,0.18)}
.p-box:last-child{border-right:none}
.p-box.active {
  background-color: #F07F00; /* Kotak kuning emas penuh */
  color: #000000;            /* Teks di dalamnya berubah hitam agar kontras */
  border-radius: 6px;
}
.p-lbl {font-size: 1.8vw;   /* Label SUBUH..ISYA menyesuaikan layar */}
.p-val {font-size: 2.6vw;   /* Jam 04:05..19:08 menyesuaikan layar */}
#btn-setting {
  position: fixed;
  top: 1.5vw;
  right: 1.5vw;
  background-color: rgba(255, 255, 255, 0.35);
  color: #FFBF00;
  border: 1px solid rgba(255, 191, 0, 0.4);
  border-radius: 0.8vw;
  padding: 0.8vw 1.6vw;
  font-size: 1.0vw;
  font-weight: bold;
  z-index: 10;
}

#status-badge {
  position: fixed;
  bottom: 0.6vw;
  left: 1.2vw;
  opacity: 0.45;
  font-size: 1.3vw;
}

#modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.65);z-index:100}
#modal-box{background:#FFF8DC;color:#000;width:85%;max-width:380px;margin:25px auto;padding:16px 20px;border-radius:10px;text-align:left}
#modal-box h3{margin:0 0 12px 0;font-size:18px;border-bottom:1px solid #CCC;padding-bottom:6px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:bold;margin-bottom:4px}
.form-group input[type="number"]{width:92%;padding:7px;font-size:16px;border:1px solid #888;border-radius:5px}
.btn-row{text-align:right;margin-top:14px}
.btn{padding:8px 14px;font-size:14px;font-weight:bold;border:none;border-radius:5px;margin-left:6px}
.btn-save{background:#2E7D32;color:#FFF}.btn-reset{background:#E65100;color:#FFF}.btn-close{background:#757575;color:#FFF}
</style></head><body>
<button id="btn-setting" onclick="bukaSetting()">&#9881; Setting</button>
<div id="status-badge">Sumber: Bawaan</div>
<div class="wrapper">
  <div class="top-row"><div class="top-cell">
    <div class="container">
      <div class="col"><div id="day" class="sub">...</div><div id="date" class="sub">...</div><div id="clock" class="main">00:00:00</div></div>
      <div class="col"><div id="pname" class="sub">...</div><div id="ptime" class="sub">--:--</div><div id="cdown" class="main">00:00:00</div></div>
    </div>
  </div></div>
  <div class="bot-row"><div class="bot-cell">
    <div class="grid6">
      <div class="p-box" id="box0"><div class="p-lbl" id="lbl0">SUBUH</div><div class="p-val" id="val0">--:--</div></div>
      <div class="p-box" id="box1"><div class="p-lbl" id="lbl1">DHUHA</div><div class="p-val" id="val1">--:--</div></div>
      <div class="p-box" id="box2"><div class="p-lbl" id="lbl2">DZUHUR</div><div class="p-val" id="val2">--:--</div></div>
      <div class="p-box" id="box3"><div class="p-lbl" id="lbl3">ASHR</div><div class="p-val" id="val3">--:--</div></div>
      <div class="p-box" id="box4"><div class="p-lbl" id="lbl4">MAGHRIB</div><div class="p-val" id="val4">--:--</div></div>
      <div class="p-box" id="box5"><div class="p-lbl" id="lbl5">ISYA</div><div class="p-val" id="val5">--:--</div></div>
    </div>
  </div></div>
</div>
<div id="modal-overlay"><div id="modal-box"><h3>Pengaturan Jadwal</h3>
  <div class="form-group"><label>Pre-Time Sholat (menit):</label><input type="number" id="inp-pre" min="1" max="120" value="15"></div>
  <div class="form-group"><label>Pre-Time Jumatan (menit):</label><input type="number" id="inp-jumat" min="1" max="180" value="45"></div>
  <div class="form-group"><label>Ganti Jadwal Kota (pilih js.txt):</label><input type="file" id="fileInput" accept=".txt" onchange="bacaFileManual(event)"></div>
  <div class="btn-row"><button class="btn btn-reset" onclick="resetSetting()">Default</button><button class="btn btn-close" onclick="tutupSetting()">Batal</button><button class="btn btn-save" onclick="simpanSetting()">Simpan</button></div>
</div></div>

var DEFAULT_PRE=15,DEFAULT_JUMAT=45,PRE_TIME=15,JUMATAN=45,prayerData={},lastDay=-1,sumberLbl="Bawaan";
function muatSetting(){try{var p=localStorage.getItem('cfg_pre_time'),j=localStorage.getItem('cfg_jumatan');if(p!==null&&!isNaN(parseInt(p,10)))PRE_TIME=parseInt(p,10);if(j!==null&&!isNaN(parseInt(j,10)))JUMATAN=parseInt(j,10);}catch(e){}}
function bukaSetting(){document.getElementById('inp-pre').value=PRE_TIME;document.getElementById('inp-jumat').value=JUMATAN;document.getElementById('modal-overlay').style.display='block';}
function tutupSetting(){document.getElementById('modal-overlay').style.display='none';}
function simpanSetting(){var vp=parseInt(document.getElementById('inp-pre').value,10),vj=parseInt(document.getElementById('inp-jumat').value,10);if(!isNaN(vp)&&vp>=0)PRE_TIME=vp;if(!isNaN(vj)&&vj>=0)JUMATAN=vj;try{localStorage.setItem('cfg_pre_time',PRE_TIME);localStorage.setItem('cfg_jumatan',JUMATAN);}catch(e){}tutupSetting();updateUI();}
function resetSetting(){PRE_TIME=DEFAULT_PRE;JUMATAN=DEFAULT_JUMAT;document.getElementById('inp-pre').value=PRE_TIME;document.getElementById('inp-jumat').value=JUMATAN;try{localStorage.removeItem('cfg_pre_time');localStorage.removeItem('cfg_jumatan');}catch(e){}}
function trimS(s){return s.replace(/^\s+|\s+$/g,'');}
function ambil(a,i){return a.slice(i,i+1).join('');}
function parseJadwal(t){var h={},ls=t.split(/\r?\n/);for(var i=1;i<ls.length;i++){var l=trimS(ambil(ls,i));if(!l)continue;var p=l.split('|');if(p.length===7){var tgl=trimS(ambil(p,0)),tm=[];for(var j=1;j<7;j++)tm.push(trimS(ambil(p,j)));h[tgl]=tm;}}return h;}
function muatSumber(){var s=null;sumberLbl="Bawaan";try{if(window.AndroidBridge&&typeof window.AndroidBridge.bacaJsTxt==='function'){var ex=window.AndroidBridge.bacaJsTxt();if(ex&&ex.length>10){s=ex;sumberLbl="Eksternal (/sdcard/js.txt)";}}}catch(e){}if(!s){try{var sv=localStorage.getItem('jadwal_sholat_txt');if(sv&&sv.length>10){s=sv;sumberLbl="Memori Lokal";}}catch(e){}}if(!s){s=document.getElementById('raw-jadwal').textContent;sumberLbl="Bawaan";}prayerData=parseJadwal(s);}
function bacaFileManual(ev){var fl=ev.target.files;if(!fl||fl.length===0)return;var f=fl.item(0),r=new FileReader();r.onload=function(e){var isi=e.target.result;prayerData=parseJadwal(isi);try{localStorage.setItem('jadwal_sholat_txt',isi);}catch(er){}sumberLbl="Memori ("+f.name+")";updateUI();alert("Jadwal "+f.name+" berhasil dimuat!");};r.readAsText(f);}
function pad2(n){return(n<10?'0':'')+n;}
function fmtKey(d){return pad2(d.getMonth()+1)+':'+pad2(d.getDate());}
function cekNext(now){var fri=(now.getDay()===5),pn=['Subuh','Dhuha',fri?'Jumatan':'Dzuhur','Ashr','Maghrib','Isya'],tp=prayerData[fmtKey(now)],ns=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();if(tp){for(var i=0;i<tp.length;i++){var js=ambil(tp,i),pp=js.split(':'),ps=parseInt(ambil(pp,0),10)*3600+parseInt(ambil(pp,1),10)*60;if(ps>ns)return{name:ambil(pn,i),timeStr:js,index:i,isNextDay:false};}}var bsk=new Date(now.getTime()+86400000),nk=fmtKey(bsk);if(prayerData[nk])return{name:'Subuh',timeStr:ambil(prayerData[nk],0),index:0,isNextDay:true};return null;}
function updateGridBawah(now,activeIdx,isNextDay){var fri=(now.getDay()===5);document.getElementById('lbl2').innerHTML=fri?'JUMATAN':'DZUHUR';var tp=prayerData[fmtKey(now)];for(var i=0;i<6;i++){document.getElementById('val'+i).innerHTML=tp?ambil(tp,i):'--:--';var bx=document.getElementById('box'+i);bx.setAttribute('class',(!isNextDay&&i===activeIdx)?'p-box active':'p-box');}}
function updateUI(){var now=new Date();if(lastDay!==now.getDate()){lastDay=now.getDate();muatSumber();}var ds=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];document.getElementById('day').innerHTML=ambil(ds,now.getDay());document.getElementById('date').innerHTML=pad2(now.getDate())+' '+ambil(ms,now.getMonth())+' '+now.getFullYear();document.getElementById('clock').innerHTML=pad2(now.getHours())+':'+pad2(now.getMinutes())+':'+pad2(now.getSeconds());var np=cekNext(now),eN=document.getElementById('pname'),eT=document.getElementById('ptime'),eC=document.getElementById('cdown');if(!np){eN.innerHTML="No Data";eT.innerHTML="N/A";eC.innerHTML="00:00:00";eC.setAttribute('class','main');updateGridBawah(now,-1,false);return;}updateGridBawah(now,np.index,np.isNextDay);eN.innerHTML=np.name;eT.innerHTML=np.timeStr;var pp=np.timeStr.split(':'),tg=new Date(now.getFullYear(),now.getMonth(),now.getDate(),parseInt(ambil(pp,0),10),parseInt(ambil(pp,1),10),0);if(np.isNextDay)tg=new Date(tg.getTime()+86400000);var df=Math.floor((tg.getTime()-now.getTime())/1000);if(df<0)df=0;var h=Math.floor(df/3600),m=Math.floor((df%3600)/60),s=df%60;eC.innerHTML=pad2(h)+':'+pad2(m)+':'+pad2(s);var tm=h*60+m,ep=(now.getDay()===5&&np.index===2)?JUMATAN:PRE_TIME;eC.setAttribute('class',(tm<=ep)?'main alert':'main');var bg=document.getElementById('status-badge');if(bg)bg.innerHTML=sumberLbl+" | Pre: "+PRE_TIME+"m, Jumat: "+JUMATAN+"m";}
